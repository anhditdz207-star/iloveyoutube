<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B5CFF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#0B0A10" />
  <rect x="3" y="3" width="94" height="94" rx="25" fill="none" stroke="#2A2440" stroke-width="2" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#grad)" stroke-width="6" filter="url(#glow)" />
  <polygon points="45,38 65,50 45,62" fill="url(#grad)" filter="url(#glow)" />
</svg>
